name: 🐛 Bug Report
description: File an issue about a bug or unexpected behavior in Enlace.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible to help us diagnose and fix the issue quickly.
  - type: dropdown
    id: component
    attributes:
      label: Affected Component or Adapter
      description: Which part of Enlace did you encounter this in?
      options:
        - "Canvas UI & Execution Engine (@get-enlace/ui)"
        - "FastAPI / Python (enlace-fastapi)"
        - "Express / Node.js (@get-enlace/express)"
        - "NestJS / Node.js (@get-enlace/nest)"
        - "ASP.NET Core / .NET (Enlace.AspNetCore)"
        - "Spring Boot / Java (enlace-spring-boot-starter)"
        - "Documentation & Website (get-enlace.github.io)"
        - "Other / Unsure"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Enlace Version
      description: What version are you running (e.g. 0.0.9, 0.1.0)?
      placeholder: "e.g. 0.0.9"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment & Browser
      description: Browser version, operating system, and backend runtime.
      placeholder: "e.g. Chrome 128 / macOS Sequoia 15.0 / Python 3.12"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior? Step-by-step instructions work best.
      placeholder: |
        1. Mount Enlace adapter at `/enlace`
        2. Open canvas in browser
        3. Drag operation `POST /orders` onto the canvas
        4. Configure mapping from `POST /customers`
        5. Click Run...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior & Error Details
      description: What happened instead? Include console errors, network errors, or screenshots if available.
    validations:
      required: true
  - type: textarea
    id: spec_sample
    attributes:
      label: OpenAPI Spec / Minimal Example (Optional)
      description: A minimal snippet of the OpenAPI 3.x schema triggering this behavior, if relevant.
      render: json
